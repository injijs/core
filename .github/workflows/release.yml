name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true

      - run: vp check
      - run: vp test
      - run: vp run build

      # Authenticates via npm Trusted Publishing (OIDC); no NPM_TOKEN secret is required.
      - name: Publish to npm
        run: vp pm publish --provenance --access public --no-git-checks

      - name: Create GitHub Release
        run: gh release create "$TAG_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
